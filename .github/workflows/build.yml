name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Generate site from papers.json
        run: python generate.py

      # Print the generated CV/resume pages to PDF (Chrome ships on ubuntu-latest).
      - name: Build CV and resume PDFs
        run: |
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          for doc in cv resume; do
            "$CHROME" --headless=new --no-sandbox --disable-gpu --no-pdf-header-footer \
              --print-to-pdf="$doc.pdf" "file://$PWD/$doc-print.html"
            test -s "$doc.pdf"
          done
          ls -la cv.pdf resume.pdf

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
